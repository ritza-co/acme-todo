openapi: 3.1.0
info:
  title: Acme Todo MCP Server
  description: A simple MCP server that provides search and fetch tools for a readonly todo list
  version: 1.0.0
  termsOfService: https://api.ritzademo.com/terms
  contact:
    name: API Support
    email: support@ritzademo.com
    url: https://api.ritzademo.com/contact
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Find more info here
  url: https://api.ritzademo.com/docs
servers:
  - url: https://acme-todo-gpt-mcp.ritzademo.com
tags:
  - name: MCP Tools
paths:
  /search:
    post:
      operationId: search
      summary: Search for todos based on query
      description: MCP search tool - returns a list of potentially relevant todos from the data set
      tags:
        - MCP Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Search query string
              required:
                - query
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                required:
                  - results
  /fetch:
    post:
      operationId: fetch
      summary: Fetch complete todo details by ID
      description: MCP fetch tool - retrieves the full contents of a todo item
      tags:
        - MCP Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Unique identifier for the todo
              required:
                - id
      responses:
        '200':
          description: Complete todo details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchResult'
        '404':
          description: Todo not found
components:
  schemas:
    SearchResult:
      type: object
      properties:
        id:
          type: string
          description: Unique ID for the todo item
        title:
          type: string
          description: Title of the todo item
        text:
          type: string
          description: Relevant snippet or preview text
        url:
          type: string
          description: URL to the todo item
      required:
        - id
        - title
        - text
        - url
    FetchResult:
      type: object
      properties:
        id:
          type: string
          description: Unique ID for the todo item
        title:
          type: string
          description: Title of the todo item
        text:
          type: string
          description: Full text content of the todo
        url:
          type: string
          description: URL to the todo item
        metadata:
          type: object
          nullable: true
          description: Optional metadata about the todo
          properties:
            completed:
              type: boolean
            dueDate:
              type: string
              format: date
              nullable: true
            description:
              type: string
              nullable: true
      required:
        - id
        - title
        - text
        - url
